name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Core purity (src/core/ must not use the windows crate)
        shell: bash
        run: |
          if grep -rnE '\bwindows::|\b(use|extern\s+crate)\s+windows\b' src/core/; then
            echo "::error::src/core/ mentions the windows crate (SPEC 12.2: core never depends on it)"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked
